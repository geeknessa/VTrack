services:
  # ── Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: vtrack-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with cloud PostgreSQL connection string
      - key: SESSION_SECRET
        generateValue: true # Render will generate a cryptographically secure key
      - key: CLIENT_URL
        sync: false # Set to frontend URL (e.g. https://vtrack-frontend.onrender.com or custom domain)

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: vtrack-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vtrack-api
          property: host
